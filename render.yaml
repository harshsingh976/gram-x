services:
  # -------------------------------------------------------------
  # 1. GRAM-X Backend Web Service (FastAPI + Python + WebSockets)
  # -------------------------------------------------------------
  - type: web
    name: gramx-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gramx-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_BUCKET
        value: gramx-evidence
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: STT_PROVIDER
        value: whisper_api
      - key: STT_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://gramx-frontend.onrender.com,https://gramx.gov.in"
    healthCheckPath: /health

  # -------------------------------------------------------------
  # 2. GRAM-X Frontend Static Site (Vite + React + 3D WebGL)
  # -------------------------------------------------------------
  - type: web
    name: gramx-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_BASE_URL
        value: https://gramx-backend.onrender.com/api

# -------------------------------------------------------------
# 3. GRAM-X Managed PostgreSQL Database (Production Persistence)
# -------------------------------------------------------------
databases:
  - name: gramx-postgres
    databaseName: gramx_db
    user: gramx_user
    region: oregon
    plan: starter


